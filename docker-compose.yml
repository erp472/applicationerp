services:
  api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: pos472_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SKIP_MAC_VALIDATION: "true"
      DATABASE_URL: postgresql://postgres:123456@host.docker.internal:5432/pos_472?schema=public
      JWT_SECRET: dev_secret_change_in_prod_minimo_32_chars_ok
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,tauri://localhost,https://tauri.localhost"
      MONGODB_URI: mongodb://pos472_mongo:pos472_mongo_pass@pos472_mongo:27017/pos472_audit?authSource=admin
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
