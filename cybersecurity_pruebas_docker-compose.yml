# ELK Stack + Elastic Security — entorno de pruebas
# Levantar: docker compose -f cybersecurity_pruebas_docker-compose.yml up -d
# Kibana:   http://localhost:5601  (elastic / ${ELASTIC_PASSWORD})
#
# NOTA: TLS deshabilitado y usuario elastic para todo — solo para pruebas locales.

services:

  # ── Elasticsearch ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elk_elasticsearch
    restart: unless-stopped
    environment:
      - node.name=elk_elasticsearch
      - cluster.name=pos472-elk
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-pos472_elastic_dev}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - elk_net
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -s -u elastic:${ELASTIC_PASSWORD:-pos472_elastic_dev} \
          http://localhost:9200/_cluster/health \
          | grep -q '"status":"green"\|"status":"yellow"'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Kibana (incluye Elastic Security) ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: elk_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-pos472_elastic_dev}
      # Clave de 32+ chars requerida para Saved Objects cifrados (alertas, reglas SIEM)
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENC_KEY:-pos472_kibana_enc_key_32chars!!}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SEC_KEY:-pos472_kibana_sec_key_32chars!!!}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REP_KEY:-pos472_kibana_rep_key_32chars!!!}
      - XPACK_FLEET_ENABLED=false
      - TELEMETRY_ENABLED=false
    ports:
      - "5601:5601"
    networks:
      - elk_net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q 'available'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Logstash — pipeline de ingesta ────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: elk_logstash
    restart: unless-stopped
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-pos472_elastic_dev}
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "5044:5044"   # Beats input
      - "9600:9600"   # Logstash monitoring API
    networks:
      - elk_net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Filebeat — recolector de logs del contenedor pos472_api ───────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: elk_filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-pos472_elastic_dev}
    networks:
      - elk_net
    depends_on:
      - logstash
    command: filebeat -e --strict.perms=false

volumes:
  es_data:
    driver: local
  filebeat_data:
    driver: local

networks:
  elk_net:
    driver: bridge
