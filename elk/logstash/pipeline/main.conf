# Pipeline Logstash — pos472 POS system
# Recibe logs de Filebeat, parsea JSON de NestJS/Pino y enruta a Elasticsearch.

input {
  beats {
    port => 5044
  }
}

filter {
  # ── Parsear JSON de NestJS (Pino logger) ────────────────────────────────────
  if [message] =~ /^\{/ {
    json {
      source  => "message"
      target  => "app"
      skip_on_invalid_json => true
    }

    # Mapear campos Pino a campos ECS (Elastic Common Schema)
    if [app][level] {
      mutate {
        rename => { "[app][msg]"      => "[log][message]"  }
        rename => { "[app][context]"  => "[log][logger]"   }
        rename => { "[app][pid]"      => "[process][pid]"  }
      }

      # Pino usa niveles numéricos: 10=trace 20=debug 30=info 40=warn 50=error 60=fatal
      if [app][level] == 10 { mutate { add_field => { "[log][level]" => "trace" } } }
      if [app][level] == 20 { mutate { add_field => { "[log][level]" => "debug" } } }
      if [app][level] == 30 { mutate { add_field => { "[log][level]" => "info"  } } }
      if [app][level] == 40 { mutate { add_field => { "[log][level]" => "warn"  } } }
      if [app][level] == 50 { mutate { add_field => { "[log][level]" => "error" } } }
      if [app][level] == 60 { mutate { add_field => { "[log][level]" => "fatal" } } }
    }
  }

  # ── Enriquecer logs del contenedor pos472_api ────────────────────────────────
  if [container][name] == "pos472_api" or [container][name] =~ /pos472/ {
    mutate {
      add_tag   => ["pos472", "nestjs", "pos-system"]
      add_field => { "[service][name]"    => "pos472-api" }
      add_field => { "[service][type]"    => "nestjs"     }
      add_field => { "[environment]"      => "desarrollo" }
    }

    # ── Detectar eventos de seguridad relevantes ─────────────────────────────
    # Auth failures → alerta en Elastic Security
    if [log][message] =~ /[Uu]nauthorized|401|403|[Ff]orbidden|[Ii]nvalid.*token|[Ee]xpired.*token/ {
      mutate {
        add_tag   => ["security_alert", "auth_failure"]
        add_field => { "[event][category]" => "authentication" }
        add_field => { "[event][outcome]"  => "failure"        }
        add_field => { "[event][type]"     => "denied"         }
      }
    }

    # Intentos de acceso a rutas inexistentes (posible escaneo)
    if [log][message] =~ /404|Cannot (GET|POST|PUT|DELETE|PATCH)/ {
      mutate {
        add_tag   => ["route_not_found"]
        add_field => { "[event][category]" => "network"  }
        add_field => { "[event][type]"     => "denied"   }
      }
    }

    # Errores 5xx — posible ataque o falla crítica
    if [log][message] =~ /500|Internal Server Error|[Ee]xception/ {
      mutate {
        add_tag   => ["server_error"]
        add_field => { "[event][category]" => "process" }
        add_field => { "[event][outcome]"  => "failure" }
      }
    }

    # Movimientos de caja con montos altos (umbral configurable)
    if [log][message] =~ /movimiento|apertura|cierre|reposicion|consignacion/ {
      mutate {
        add_tag   => ["caja_event"]
        add_field => { "[event][category]" => "financial" }
        add_field => { "[event][dataset]"  => "pos472.cajas" }
      }
    }
  }

  # ── Descartar logs de los propios contenedores ELK (ruido) ──────────────────
  if [container][name] =~ /^elk_/ {
    drop { }
  }

  # ── Garantizar service.name en minúsculas para el índice ─────────────────────
  if ![service][name] {
    mutate { add_field => { "[service][name]" => "docker-logs" } }
  }
  mutate { lowercase => ["[service][name]"] }

  # ── Limpiar campos internos de Filebeat/Docker ───────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "tags_original"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"

    index => "%{[service][name]}-%{+YYYY.MM.dd}"

    ilm_enabled => false
  }

  # Debug en desarrollo — quitar en producción
  # stdout { codec => rubydebug }
}
